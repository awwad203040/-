<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نور القرآن</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #123B2A;
      color: #FBF8EF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 28px;
      color: #C8A85B;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 30px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(200, 168, 91, 0.2);
      border-top-color: #C8A85B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="icon-512.png" alt="نور القرآن" class="logo">
  <h1>نور القرآن</h1>
  <p>المصحف الشريف وتصحيح التلاوة الذكي</p>
  <div class="loader"></div>
  <script>
    window.location.href = 'https://awwad2030.vercel.app';
  </script>
</body>
</html>
